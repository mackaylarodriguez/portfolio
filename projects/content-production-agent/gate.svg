<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Human editor approval gate">
  <rect width="1600" height="900" fill="#0a192f"/>
  <text x="80" y="90" fill="#64ffda" font-family="Source Code Pro, ui-monospace, monospace" font-size="22">approval gate</text>
  <text x="80" y="150" fill="#ccd6f6" font-family="Source Code Pro, ui-monospace, monospace" font-size="48" font-weight="700">A person still decides</text>
  <text x="80" y="200" fill="#8892b0" font-family="Source Code Pro, ui-monospace, monospace" font-size="22">Editor veto stays. The system never publishes.</text>

  <g font-family="Source Code Pro, ui-monospace, monospace">
    <rect x="80" y="300" rx="18" width="460" height="200" fill="#112240" stroke="#64ffda" stroke-opacity="0.45"/>
    <text x="310" y="380" text-anchor="middle" fill="#64ffda" font-size="20">PASS</text>
    <text x="310" y="425" text-anchor="middle" fill="#dbe5f1" font-size="24" font-weight="700">draft is ready</text>
    <text x="310" y="460" text-anchor="middle" fill="#8892b0" font-size="18">human would still publish</text>

    <rect x="570" y="300" rx="18" width="460" height="200" fill="#112240" stroke="#64ffda" stroke-opacity="0.45"/>
    <text x="800" y="380" text-anchor="middle" fill="#64ffda" font-size="20">REVISE #1</text>
    <text x="800" y="425" text-anchor="middle" fill="#dbe5f1" font-size="24" font-weight="700">writer rewrites</text>
    <text x="800" y="460" text-anchor="middle" fill="#8892b0" font-size="18">from editor notes only</text>

    <rect x="1060" y="300" rx="18" width="460" height="200" fill="rgba(100,255,218,0.08)" stroke="#64ffda"/>
    <text x="1290" y="380" text-anchor="middle" fill="#64ffda" font-size="20">REVISE #2</text>
    <text x="1290" y="425" text-anchor="middle" fill="#dbe5f1" font-size="24" font-weight="700">flag human editor</text>
    <text x="1290" y="460" text-anchor="middle" fill="#8892b0" font-size="18">pipeline stops here</text>
  </g>
</svg>
